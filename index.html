<script>
const levels=[
{name:'數字偵察',icon:'🔍',topic:'因數與倍數',intro:'先認識整除的線索：哪些數能整齊分組？哪些數會一直出現在數表裡？',rule:'因數：可以整除它的數',text:'若 a ÷ b 沒有餘數，b 就是 a 的因數。a 也是 b 的倍數。例如 12 的因數有 1、2、3、4、6、12。',qs:[
{v:'12 個能量球',q:'哪一個數是 12 的因數？',a:['5','6','7','8'],c:1,h:'想想看：12 ÷ 哪個選項會剛好沒有餘數？',e:'12 ÷ 6 = 2，沒有餘數，所以 6 是 12 的因數。'},
{v:'3 → 3、6、9、…',q:'3 的倍數不包含哪一個？',a:['12','15','18','20'],c:3,h:'把 3 一直加上去：3、6、9、12……',e:'3 的倍數是 3×整數；20 不能被 3 整除。'},
{v:'24 ÷ 4 = ?',q:'4 是 24 的因數，因為……',a:['24÷4=6','24+4=28','4÷24=6','24×4=96'],c:0,h:'因數要能讓被除數整除。',e:'24 ÷ 4 = 6，商是整數、沒有餘數。'},
{v:'5、10、15、20…',q:'下面哪個是 5 的倍數？',a:['22','27','35','38'],c:2,h:'5 的倍數個位數通常是 0 或 5。',e:'35 = 5×7，所以是 5 的倍數。'}]},
{name:'整除瞄準',icon:'🎯',topic:'整除與因數配對',intro:'用整除規則快速找出目標，並用成對的因數縮短搜尋時間。',rule:'成對因數一起找',text:'若 3 是 18 的因數，6 也會是因數，因為 3×6=18。找因數時別漏掉配對！',qs:[
{v:'18 = 2 × ?',q:'18 的因數配對中，2 的搭檔是？',a:['7','8','9','16'],c:2,h:'2 乘上幾會等於 18？',e:'2×9=18，所以 2 和 9 是一組因數配對。'},
{v:'能量門：偶數？',q:'哪個數一定是 2 的倍數？',a:['31','42','55','67'],c:1,h:'能被 2 整除的整數，個位數是 0、2、4、6、8。',e:'42 的個位數是 2，所以能被 2 整除。'},
{v:'因數配對：3 × ?',q:'3 是 27 的因數，它的配對因數是？',a:['6','8','9','12'],c:2,h:'27 ÷ 3 = ?',e:'27 ÷ 3 = 9，因此 3 和 9 配對。'},
{v:'整除密碼',q:'哪一個是 10 的倍數？',a:['45','60','72','89'],c:1,h:'10 的倍數個位數會是什麼？',e:'60 個位數是 0，所以是 10 的倍數。'}]},
{name:'質數守門',icon:'🛡️',topic:'質數與合數',intro:'數字也有不同隊伍：只有兩個因數的加入質數隊，更多因數的加入合數隊。',rule:'質數的因數剛好兩個',text:'質數只有 1 和自己兩個正因數；合數有超過兩個正因數。1 既不是質數，也不是合數。',qs:[
{v:'因數只有 1 和自己',q:'哪一個是質數？',a:['9','11','15','21'],c:1,h:'試著找因數：11 除了 1 和 11，還能被 2、3 整除嗎？',e:'11 只有 1 和 11 兩個因數，所以是質數。'},
{v:'1 的特別身分',q:'關於數字 1，哪句正確？',a:['是質數','是合數','兩者都不是','同時是兩者'],c:2,h:'質數要剛好有兩個正因數，合數要超過兩個。',e:'1 只有一個正因數，既不是質數也不是合數。'},
{v:'因數：1、2、4、8',q:'8 屬於哪一隊？',a:['質數','合數','兩者都不是','不確定'],c:1,h:'數一數 8 有幾個正因數？',e:'8 有 1、2、4、8 共四個正因數，是合數。'},
{v:'質數小隊',q:'哪個數是合數？',a:['2','3','5','9'],c:3,h:'9 可以拆成哪兩個相同數相乘？',e:'9=3×3，因數不只 1 和自己，所以是合數。'}]},
{name:'因數拆解',icon:'🧩',topic:'質因數',intro:'把合數拆成質數積木，檢查每一塊是不是質數，直到全部拆完。',rule:'質因數是「質數身分」的因數',text:'例如 12 = 2×2×3；每個因數積木都是質數，因此 2、3 是 12 的質因數。',qs:[
{v:'12 = 2 × 2 × 3',q:'12 的質因數有哪些？',a:['2、3','2、6','3、4','1、12'],c:0,h:'看看拆解後哪些積木本身是質數。',e:'12=2×2×3，質因數是 2 和 3（若列出重複因數則 2、2、3）。'},
{v:'10 = 2 × ?',q:'10 的質因數分解是？',a:['2×5','1×10','2×3','5×5'],c:0,h:'10 ÷ 2 = ?',e:'10=2×5，而且 2、5 都是質數。'},
{v:'15 的因數積木',q:'15 可以拆成哪兩個質數相乘？',a:['3×5','1×15','2×7','3×6'],c:0,h:'15 ÷ 3 = ?',e:'15=3×5，3 和 5 都是質數。'},
{v:'18 = 2 × 9',q:'拆解 18 時，哪一步能繼續得到質因數？',a:['9=3×3','2=1×2','18=1×18','9=1×9'],c:0,h:'9 是質數嗎？它還能拆成相同的質數相乘嗎？',e:'18=2×9=2×3×3，所有因數積木都是質數。'}]},
{name:'終極連鎖',icon:'🚀',topic:'質因數分解總挑戰',intro:'綜合運用因數、質數和拆解。每一次分解都把合數拆小，直到只剩質數。',rule:'一路拆到每個因數都是質數',text:'可用短除法或因數樹。例如 24=2×12=2×2×6=2×2×2×3。順序不同，質因數結果相同。',qs:[
{v:'20 → 2 × 10 → ?',q:'20 的質因數分解是？',a:['2×2×5','4×5','1×20','2×10'],c:0,h:'10 還是合數，要再拆一次。',e:'20=2×10=2×2×5，2、5 都是質數。'},
{v:'因數樹：28',q:'28 的質因數分解是？',a:['2×2×7','4×7','2×14','1×28'],c:0,h:'28=4×7，4 還要再拆喔。',e:'28=4×7=2×2×7。'},
{v:'18 的全部質因數',q:'哪一個分解完整且正確？',a:['2×3×3','2×9','3×6','1×18'],c:0,h:'每一塊最後都必須是質數。',e:'18=2×3×3；2 和 3 都是質數，拆解完整。'},
{v:'最後一發：30',q:'30 的質因數分解是？',a:['2×3×5','3×10','5×6','1×30'],c:0,h:'30=2×15，15 還可以拆成哪兩個質數？',e:'30=2×3×5，三個因數都是質數！'}]}
];
const key='numberSlingshotV1';let state=JSON.parse(localStorage.getItem(key)||'null')||{unlocked:0,completed:[],stars:0,review:[]};let day=0,qi=0,correct=0,answered=false,hinted=false;
const $=id=>document.getElementById(id);function save(){localStorage.setItem(key,JSON.stringify(state));renderMap();$('starCount').textContent=state.stars;$('medalCount').textContent=state.completed.length}
function renderMap(){ $('days').innerHTML=levels.map((l,i)=>{let done=state.completed.includes(i),lock=i>state.unlocked;return `<button class="day ${i===day?'active':''} ${done?'done':''}" ${lock?'disabled':''} data-day="${i}"><span class="num">DAY ${i+1} ${lock?'🔒':''}</span><span class="icon">${l.icon}</span><b>${l.name}</b><div class="stars">${done?'🏅 清除':'☆☆☆'}</div></button>`}).join('');document.querySelectorAll('.day:not(:disabled)').forEach(b=>b.onclick=()=>{day=+b.dataset.day;start()})}
function start(){qi=0;correct=0;answered=false;hinted=false;$('playArea').style.display='block';$('finish').style.display='none';renderMap();showQuestion()}
function showQuestion(){let l=levels[day],q=l.qs[qi];$('levelTag').textContent=`第 ${day+1} 天 · ${l.name}`;$('qCount').textContent=`題目 ${qi+1} / ${l.qs.length}`;$('bar').style.width=`${qi/l.qs.length*100}%`;$('visual').innerHTML=q.v.split(' ').map(t=>`<span class="bubble">${t}</span>`).join('');$('question').textContent=q.q;$('feedback').textContent='';$('hintBtn').disabled=false;$('nextBtn').disabled=true;$('nextBtn').textContent=qi===l.qs.length-1?'完成本關 🏅':'下一題 →';$('answers').innerHTML=q.a.map((a,i)=>`<button class="answer" data-a="${i}">${a}</button>`).join('');document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>choose(+b.dataset.a));$('lessonIntro').textContent=l.intro;$('ruleTitle').textContent=l.rule;$('ruleText').textContent=l.text;answered=false;hinted=false;renderReview()}
function choose(n){if(answered)return;answered=true;let q=levels[day].qs[qi],buttons=[...document.querySelectorAll('.answer')];buttons.forEach(b=>b.disabled=true);if(n===q.c){correct++;buttons[n].classList.add('correct');$('feedback').textContent='命中！'+q.e}else{buttons[n].classList.add('wrong');buttons[q.c].classList.add('correct');$('feedback').textContent='差一點點！一起看解法：'+q.e;state.review.unshift({q:q.q,ans:q.a[n],correct:q.a[q.c],exp:q.e});state.review=state.review.slice(0,20);save()}$('nextBtn').disabled=false;$('hintBtn').disabled=true}
function showFinish(){ $('playArea').style.display='none';$('finish').style.display='block';let earned=correct>=4?3:correct>=3?2:1;let first=!state.completed.includes(day);if(first){state.completed.push(day);state.completed.sort();state.stars+=earned;state.unlocked=Math.max(state.unlocked,Math.min(4,day+1))}save();$('bar').style.width='100%';$('finishTitle').textContent=correct===4?'漂亮的連鎖命中！':'任務完成，經驗值到手！';$('finishText').textContent=`你答對 ${correct}/4 題，獲得 ${first?'⭐'.repeat(earned):'本關已領取過星星'}。${correct<4?'錯題已加入再練習清單，看看解說，下次會更準！':'每一次穩穩思考都讓你更進一步。'}`;$('finishBtn').textContent=day<4?'前往下一關 →':'回看闖關地圖 ✨';$('finishBtn').onclick=()=>{if(day<4){day++;start()}else{renderMap();$('finish').style.display='none';$('playArea').style.display='block';$('question').textContent='五日挑戰完成！再選一關練熟吧。';$('visual').innerHTML='🏆　數字高手';$('answers').innerHTML='';$('feedback').textContent='星星保存在這台裝置上，隨時回來複習。';$('nextBtn').disabled=true;$('hintBtn').disabled=true}}}
function renderReview(){let list=$('review');list.innerHTML=state.review.length?state.review.map(x=>`<div class="review-item"><strong>${x.q}</strong><br>你選：${x.ans}　｜　答案：${x.correct}<br>${x.exp}</div>`).join(''):'<div class="review-empty">這裡會收藏需要再練一次的題目。每次錯誤都是找出新線索的機會！</div>'}
$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({format:'numberSlingshotV1',savedAt:new Date().toISOString(),state},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='數字彈弓隊進度備份.json';a.click();URL.revokeObjectURL(a.href)};$('importBtn').onclick=()=> $('backupFile').click();$('backupFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());const s=data.state;if(data.format!=='numberSlingshotV1'||!s||!Array.isArray(s.completed)||!Array.isArray(s.review)||!Number.isInteger(s.unlocked)||!Number.isInteger(s.stars))throw Error();state=s;save();start();alert('進度已還原！')}catch{alert('這不是有效的數字彈弓隊備份檔。')}e.target.value=''};$('hintBtn').onclick=()=>{let q=levels[day].qs[qi];$('feedback').textContent='💡 提示：'+q.h;hinted=true};$('nextBtn').onclick=()=>{if(!answered)return;if(qi<levels[day].qs.length-1){qi++;showQuestion()}else showFinish()};$('resetBtn').onclick=()=>{if(confirm('要清除這台裝置的闖關紀錄，重新開始嗎？')){state={unlocked:0,completed:[],stars:0,review:[]};day=0;save();start()}};
save();start();
</script></body></html>
